name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install Python backend and test dependencies
        run: python -m pip install -e ./cli pytest
      - name: JavaScript regressions
        run: npm test
      - name: Python backend regressions
        run: python -m pytest cli/tests -q
